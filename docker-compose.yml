services:

  # PHP + Apache web server
  php:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./src/Code:/var/www/html
    depends_on:
      - db

  # MySQL database
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: csym019
      MYSQL_DATABASE: Internet_programming
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Adminer - database visual interface
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db